[NEAT]
fitness_criterion = max
fitness_threshold = 1.0
pop_size = 9
reset_on_extinction = False
no_fitness_termination = True

[DefaultGenome]
num_inputs = 3
num_outputs = 3
num_hidden = 2
feed_forward = True
initial_connection = full_direct
activation_default = random
activation_options = sin gauss tanh sigmoid identity abs
activation_mutate_rate = 0.05
aggregation_default = sum
aggregation_options = sum
aggregation_mutate_rate = 0.0
bias_init_mean = 0.0
bias_init_stdev = 0.5
bias_max_value = 10.0
bias_min_value = -10.0
bias_mutate_power = 0.2
bias_mutate_rate = 0.3
bias_replace_rate = 0.0
response_init_mean = 1.0
response_init_stdev = 0.0
response_max_value = 1.0
response_min_value = 1.0
response_mutate_power = 0.0
response_mutate_rate = 0.0
response_replace_rate = 0.0
weight_init_mean = 0.0
weight_init_stdev = 1.0
weight_max_value = 10.0
weight_min_value = -10.0
weight_mutate_power = 0.2
weight_mutate_rate = 0.7
weight_replace_rate = 0.0
enabled_default = True
enabled_mutate_rate = 0.01
conn_add_prob = 0.2
conn_delete_prob = 0.05
node_add_prob = 0.2
node_delete_prob = 0.02
single_structural_mutation = True
structural_mutation_surer = default
compatibility_disjoint_coefficient = 1.0
compatibility_weight_coefficient = 0.5

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation = 20
species_elitism = 1

[DefaultReproduction]
elitism = 1
survival_threshold = 0.2
min_species_size = 1

[CPPNRendering]
output_mapping = picbreeder_hsb_v1
