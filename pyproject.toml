[project]
name = "automated-picbreeder"
version = "0.1.0"
description = "Human and automated selection of compositional pattern-producing networks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/automated_picbreeder/reference_data/skull/LICENSE"]
authors = [
    { name = "camin-mccluskey", email = "mccluskey.camin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29,<8",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.4,<5",
    "neat-python==2.0.0",
    "numpy>=2.2,<3",
    "pillow>=11,<13",
]

[project.optional-dependencies]
imagenet = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]
vlm = [
    "openrouter>=1.3.11,<2",
    "python-dotenv>=1,<2",
]

[project.scripts]
viewer = "automated_picbreeder.experiment_viewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "nbclient>=0.10,<1",
    "pytest>=8,<10",
]
